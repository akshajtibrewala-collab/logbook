<!doctype html>
<html lang="en" style="background:#000;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Dark only: true black before the app mounts (no white flash), dark scrollbars, form controls, pickers and iOS keyboard. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <style>html,body{background:#000;color-scheme:dark}</style>
    <title>AeroHub</title>

    <!-- Icons: browser tab, iOS home screen, Android/Chrome install (see client/scripts/generate-icons.mjs) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Home-screen behaviour: full screen, no browser chrome, short label under the icon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AeroHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="AeroHub" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
